allowBuilds:
  esbuild: true

# pnpm v11 reads project-level settings from pnpm-workspace.yaml (not from
# .npmrc, which pnpm v11.1.3 no longer merges for non-auth keys).
#
# minimumReleaseAge: 0 disables pnpm v11's supply-chain freshness policy
#   so Renovate bumps to recently-published deps (vendor patch releases
#   within 24h of publish) don't block installs or husky pre-commit hooks.
# verifyDepsBeforeRun: false suppresses the deps-status check that fires
#   before every `pnpm <script>` invocation. The check is noise here
#   because lockfiles are routinely briefly stale (mentat-pull-all.sh
#   deletes lockfiles before each build cycle).
minimumReleaseAge: 0
verifyDepsBeforeRun: false

overrides:
  typescript: 6.0.3 # block native TS7 (no classic JS API — crashes tsc/nest/sonarjs); pairs with renovate TS-major block
  # Security overrides for transitive deps (all satisfy their parent ranges):
  # - fast-uri: GHSA-q3j6-qgpj-74h6 + GHSA-v39h-62p7-jpjc (high); patched 3.1.4.
  # - ws: GHSA-96hv-2xvq-fx4p (high) + GHSA-58qx-3vcg-4xpx (moderate); patched 8.21.0.
  # - js-yaml: GHSA-h67p-54hq-rp68 (moderate); patched 4.2.0.
  # A security FLOOR, not a range. It was '^4.0.0' for an earlier advisory and stopped being
  # a floor when four more landed INSIDE 4.x (host confusion x2, SSRF x2), all first patched
  # in 4.1.3 while the lockfile sat on 4.1.2. Pin the floor to the patched version.
  fast-uri: '^4.1.3'
  ws: '^8.21.0'
  js-yaml: '^5.0.0'
